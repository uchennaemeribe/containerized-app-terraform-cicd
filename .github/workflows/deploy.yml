# ==========================================================
# FILE: .github/workflows/deploy.yml
# PURPOSE:
# Enterprise CI/CD Pipeline
# Terraform Infrastructure Provisioning + Docker Deployment
#
# FEATURES:
# - Dynamic EC2 provisioning
# - Terraform automation
# - Secure SSH configuration
# - Dockerized application deployment
# - Dynamic infrastructure cleanup readiness
# ==========================================================

name: Build Provision Deploy

on:
  push:
    branches:
      - main

# ==========================================================
# GLOBAL ENVIRONMENT VARIABLES
# ==========================================================

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform

jobs:

  # ========================================================
  # MAIN DEPLOYMENT JOB
  # ========================================================

  deploy:
    name: Provision Infrastructure and Deploy Container
    runs-on: ubuntu-latest

    steps:

      # ====================================================
      # CHECKOUT REPOSITORY
      # ====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ====================================================
      # CONFIGURE AWS CREDENTIALS
      # ====================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ====================================================
      # SETUP TERRAFORM
      # ====================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ====================================================
      # TERRAFORM INITIALIZATION
      # ====================================================

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -reconfigure

      # ====================================================
      # TERRAFORM VALIDATION
      # ====================================================

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # ====================================================
      # TERRAFORM PLAN
      # ====================================================

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_public_key: ${{ secrets.PUBLIC_KEY }}
        run: |
          terraform plan \
          -var="public_key=${TF_VAR_public_key}" \
          -out=tfplan

      # ====================================================
      # TERRAFORM APPLY
      # ====================================================

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_public_key: ${{ secrets.PUBLIC_KEY }}
        run: |
          terraform apply \
          -auto-approve \
          tfplan

      # ====================================================
      # CAPTURE EC2 INSTANCE INFORMATION
      # ====================================================

      - name: Capture EC2 Public Information
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "INSTANCE_IP=$(terraform output -raw instance_public_ip)" >> $GITHUB_ENV
          echo "INSTANCE_DNS=$(terraform output -raw instance_public_dns)" >> $GITHUB_ENV

      # ====================================================
      # CONFIGURE SSH PRIVATE KEY
      # ====================================================

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/aws_key_pair

          chmod 600 ~/.ssh/aws_key_pair

          for i in {1..10}; do
            ssh-keyscan -H $INSTANCE_IP >> ~/.ssh/known_hosts && break
            echo "Waiting for SSH service..."
            sleep 10
          done

      # ====================================================
      # WAIT FOR EC2 INSTANCE INITIALIZATION
      # ====================================================

      - name: Wait for EC2 Readiness
        run: |
          chmod +x scripts/wait-for-instance.sh
          ./scripts/wait-for-instance.sh "$INSTANCE_IP"

      # ====================================================
      # DEPLOY DOCKER CONTAINER
      # ====================================================

      - name: Deploy Docker Container
        run: |
          ssh -i ~/.ssh/aws_key_pair \
            -o StrictHostKeyChecking=no \
            ubuntu@$INSTANCE_IP << 'EOF'

            sudo apt-get update -y

            sudo apt-get install -y docker.io git

            sudo systemctl start docker
            sudo systemctl enable docker

            sudo usermod -aG docker ubuntu

            git clone https://github.com/${{ github.repository }} app

            cd app

            sudo docker build -t containerized-app .

            sudo docker rm -f containerized-app || true

            sudo docker run -d \
              --name containerized-app \
              -p 3000:3000 \
              containerized-app
          EOF

      # ====================================================
      # DEPLOYMENT COMPLETE
      # ====================================================

      - name: Deployment Complete
        run: |
          echo "======================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================="
          echo "Application URL:"
          echo "http://$INSTANCE_IP:3000"
          echo "======================================="