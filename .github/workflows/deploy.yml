# ==========================================
# FILE: .github/workflows/deploy.yml
# PURPOSE: End-to-End CI/CD Pipeline
# DESCRIPTION:
# - Install dependencies & run tests
# - Build & push Docker image to Docker Hub
# - Provision infrastructure using Terraform
# - Retrieve dynamic EC2 public IP
# - Deploy container via secure SSH
# ==========================================

name: CI/CD Pipeline Execution

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, Provision & Deploy
    runs-on: ubuntu-latest

    steps:

    # ======================================================
    # STEP 1: Checkout Repository
    # ======================================================
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # ======================================================
    # STEP 2: Install Application Dependencies
    # ======================================================
    - name: Install Dependencies
      run: npm install

    # ======================================================
    # STEP 3: Run Application Health Test
    # ======================================================
    - name: Run Tests (Health Check)
      run: |
        node app.js &
        sleep 5
        curl -f http://localhost:3000/health

    # ======================================================
    # STEP 4: Build Docker Image
    # ======================================================
    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-app .

    # ======================================================
    # STEP 5: Authenticate with Docker Hub
    # ======================================================
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # ======================================================
    # STEP 6: Push Docker Image to Registry
    # ======================================================
    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd-app

    # ======================================================
    # STEP 7: Setup Terraform CLI
    # ======================================================
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # ======================================================
    # STEP 8: Initialize Terraform
    # ======================================================
    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    # ======================================================
    # STEP 9: Apply Terraform (Provision EC2)
    # ======================================================
    - name: Terraform Apply
      working-directory: terraform
      run: terraform apply -auto-approve -var="public_key=${{ secrets.VM_PUBLIC_KEY }}"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    # ======================================================
    # STEP 10: Retrieve EC2 Public IP
    # ======================================================
    - name: Get EC2 Public IP
      id: ec2_ip
      working-directory: terraform
      run: echo "ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT

    # ======================================================
    # STEP 11: Wait for SSH Availability
    # ======================================================
    - name: Wait for EC2 SSH
      run: |
        for i in {1..12}; do
          nc -zv ${{ steps.ec2_ip.outputs.ip }} 22 && echo "SSH Ready" && exit 0
          echo "Waiting for SSH..."
          sleep 10
        done
        exit 1

    # ======================================================
    # STEP 12: Prepare SSH Private Key
    # ======================================================
    - name: Setup SSH Key
      run: |
        echo "${{ secrets.VM_SSH_KEY }}" > private_key.pem
        chmod 600 private_key.pem

    # ======================================================
    # STEP 13: Deploy Application to EC2
    # ======================================================
    - name: Deploy to EC2
      run: |
        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ steps.ec2_ip.outputs.ip }} << EOF
          docker stop app || true
          docker rm app || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-app
          docker run -d -p 3000:3000 --name app ${{ secrets.DOCKER_USERNAME }}/cicd-app
        EOF