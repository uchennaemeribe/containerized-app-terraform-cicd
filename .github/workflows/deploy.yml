name: Enterprise Terraform Docker Deployment Pipeline

# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:
  push:
    branches:
      - main

  workflow_dispatch:

# ============================================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================================

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform

# ============================================================
# JOB DEFINITIONS
# ============================================================

jobs:
  build-provision-deploy:
    name: Build Provision Deploy
    runs-on: ubuntu-latest

    # ========================================================
    # REQUIRED PERMISSIONS
    # ========================================================

    permissions:
      contents: read

    # ========================================================
    # EXECUTION STEPS
    # ========================================================

    steps:

      # ======================================================
      # CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ======================================================
      # CONFIGURE AWS CREDENTIALS
      # ======================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ======================================================
      # SETUP TERRAFORM
      # ======================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      # ======================================================
      # TERRAFORM INITIALIZATION
      # ======================================================

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # ======================================================
      # TERRAFORM VALIDATION
      # ======================================================

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # ======================================================
      # TERRAFORM PLAN
      # ======================================================

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_public_key: ${{ secrets.PUBLIC_KEY }}
        run: |
          terraform plan \
          -var="public_key=${TF_VAR_public_key}" \
          -out=tfplan

      # ======================================================
      # TERRAFORM APPLY
      # ======================================================

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_public_key: ${{ secrets.PUBLIC_KEY }}
        run: |
          terraform apply \
          -auto-approve \
          tfplan

      # ======================================================
      # CAPTURE EC2 INSTANCE DETAILS
      # ======================================================

      - name: Capture EC2 Public Information
        id: ec2info
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "INSTANCE_IP=$(terraform output -raw instance_public_ip)" >> $GITHUB_ENV
          echo "INSTANCE_DNS=$(terraform output -raw instance_public_dns)" >> $GITHUB_ENV

      # ======================================================
      # CONFIGURE SSH PRIVATE KEY
      # ======================================================

      - name: Configure SSH Key
        shell: bash
        run: |
          mkdir -p ~/.ssh

          cat <<EOF > ~/.ssh/aws_key_pair
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF

          chmod 600 ~/.ssh/aws_key_pair

          ssh-keyscan -H ${{ env.INSTANCE_IP }} >> ~/.ssh/known_hosts

      # ======================================================
      # WAIT FOR EC2 INSTANCE INITIALIZATION
      # ======================================================

      - name: Wait for EC2 Readiness
        run: |
          chmod +x scripts/wait-for-instance.sh
          ./scripts/wait-for-instance.sh "${INSTANCE_IP}"

      # ======================================================
      # DEPLOY DOCKER CONTAINER TO EC2
      # ======================================================

      - name: Deploy Docker Container
        run: |
          ssh -i ~/.ssh/aws_key_pair \
            -o StrictHostKeyChecking=no \
            azureuser@${INSTANCE_IP} << 'EOF'

            sudo apt-get update -y

            sudo apt-get install docker.io -y

            sudo systemctl start docker

            sudo systemctl enable docker

            sudo docker stop app || true

            sudo docker rm app || true

            sudo docker pull uchennaemeribe/containerized-app:latest

            sudo docker run -d \
              --name app \
              -p 80:3000 \
              uchennaemeribe/containerized-app:latest

          EOF

      # ======================================================
      # DEPLOYMENT SUCCESS MESSAGE
      # ======================================================

      - name: Deployment Complete
        run: |
          echo "=============================================="
          echo "APPLICATION DEPLOYMENT SUCCESSFUL"
          echo "=============================================="
          echo "EC2 PUBLIC IP: ${INSTANCE_IP}"
          echo "EC2 PUBLIC DNS: ${INSTANCE_DNS}"
          echo "=============================================="