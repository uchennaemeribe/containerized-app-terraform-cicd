# ==========================================================
# FILE: .github/workflows/deploy.yml
# PURPOSE: End-to-End CI/CD Pipeline
# DESCRIPTION:
# - Build & test Node.js app
# - Build & push Docker image
# - Provision AWS infrastructure via Terraform
# - Retrieve dynamic EC2 public IP
# - Deploy container via SSH
# ==========================================================

name: Build, Provision & Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: CI/CD Pipeline Execution
    runs-on: ubuntu-latest

    steps:
    # ------------------------------------------------------
    # STEP 1: Checkout Repository
    # ------------------------------------------------------
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ------------------------------------------------------
    # STEP 2: Install Dependencies
    # ------------------------------------------------------
    - name: Install Dependencies
      run: npm install

    # ------------------------------------------------------
    # STEP 3: Run Tests (App + Health Check)
    # ------------------------------------------------------
    - name: Run Tests
      run: |
        node app.js &
        sleep 5
        curl -f http://localhost:3000/health

    # ------------------------------------------------------
    # STEP 4: Build Docker Image
    # ------------------------------------------------------
    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-app .

    # ------------------------------------------------------
    # STEP 5: Login to Docker Hub
    # ------------------------------------------------------
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # ------------------------------------------------------
    # STEP 6: Push Docker Image
    # ------------------------------------------------------
    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd-app

    # ------------------------------------------------------
    # STEP 7: Setup Terraform
    # ------------------------------------------------------
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # ------------------------------------------------------
    # STEP 8: Terraform Init (Fix provider issues)
    # ------------------------------------------------------
    - name: Terraform Init
      working-directory: terraform
      run: terraform init -upgrade

    # ------------------------------------------------------
    # STEP 9: Terraform Apply
    # ------------------------------------------------------
    - name: Terraform Apply
      working-directory: terraform
      run: terraform apply -auto-approve -var="public_key=${{ secrets.VM_PUBLIC_KEY }}"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    # ------------------------------------------------------
    # STEP 10: Extract EC2 Public IP
    # ------------------------------------------------------
    - name: Get EC2 Public IP
      id: ec2_ip
      working-directory: terraform
      run: |
        echo "ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT

    # ------------------------------------------------------
    # STEP 11: Print EC2 Public IP
    # ------------------------------------------------------
    - name: Show EC2 Public IP
      run: echo "EC2_PUBLIC_IP=${{ steps.ec2_ip.outputs.ip }}"

    # ------------------------------------------------------
    # STEP 12: Wait for SSH
    # ------------------------------------------------------
    - name: Wait for EC2 SSH
      run: |
        for i in {1..12}; do
          nc -zv ${{ steps.ec2_ip.outputs.ip }} 22 && echo "SSH Ready" && exit 0
          echo "Waiting for SSH..."
          sleep 10
        done
        exit 1

    # ------------------------------------------------------
    # STEP 13: Deploy to EC2
    # ------------------------------------------------------
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ steps.ec2_ip.outputs.ip }}
        username: ubuntu
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          docker stop app || true
          docker rm app || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-app
          docker run -d -p 3000:3000 --name app ${{ secrets.DOCKER_USERNAME }}/cicd-app