# ==========================================
# FILE: .github/workflows/deploy.yml
# PURPOSE: End-to-End CI/CD Pipeline (Build, Test, Push, Provision, Deploy)
# ==========================================

name: CI/CD Pipeline

# ==========================================
# TRIGGER CONFIGURATION
# ==========================================
on:
  push:
    branches:
      - main

# ==========================================
# JOB DEFINITION
# ==========================================
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # ==========================================
    # STEP 1: CHECKOUT REPOSITORY
    # ==========================================
    - name: Checkout Repository
      uses: actions/checkout@v3

    # ==========================================
    # STEP 2: SETUP NODE ENVIRONMENT
    # ==========================================
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    # ==========================================
    # STEP 3: INSTALL DEPENDENCIES
    # ==========================================
    - name: Install Dependencies
      run: npm install

    # ==========================================
    # STEP 4: RUN TEST (START APP + HEALTH CHECK)
    # ==========================================
    - name: Run Tests (Start App + Health Check)
      run: |
        node app.js &
        sleep 5
        curl -f http://localhost:3000/health || exit 1

    # ==========================================
    # STEP 5: BUILD DOCKER IMAGE
    # ==========================================
    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-app .

    # ==========================================
    # STEP 6: LOGIN TO DOCKER HUB
    # ==========================================
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # ==========================================
    # STEP 7: PUSH DOCKER IMAGE
    # ==========================================
    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd-app

    # ==========================================
    # STEP 8: SETUP TERRAFORM
    # ==========================================
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    # ==========================================
    # STEP 9: TERRAFORM INIT
    # ==========================================
    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    # ==========================================
    # STEP 10: TERRAFORM APPLY (PROVISION INFRA)
    # ==========================================
    - name: Terraform Apply
      working-directory: terraform
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      run: terraform apply -auto-approve -var="public_key=${{ secrets.VM_PUBLIC_KEY }}"

    # ==========================================
    # STEP 11: EXTRACT EC2 PUBLIC IP (DYNAMIC)
    # ==========================================
    - name: Get EC2 Public IP
      working-directory: terraform
      run: |
        IP=$(terraform output -raw public_ip | head -n 1 | tr -d '[:space:]')
        echo "VM_HOST=$IP" >> $GITHUB_ENV

    # ==========================================
    # STEP 12: DEPLOY CONTAINER TO EC2
    # ==========================================
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.VM_HOST }}
        username: ubuntu
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          docker stop app || true
          docker rm app || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-app
          docker run -d -p 3000:3000 --name app ${{ secrets.DOCKER_USERNAME }}/cicd-app

    # ==========================================
    # STEP 13: HEALTH CHECK (PRODUCTION)
    # ==========================================
    - name: Health Check
      run: |
        sleep 10
        curl -f http://${{ env.VM_HOST }}:3000/health || exit 1