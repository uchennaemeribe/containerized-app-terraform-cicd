# ==========================================
# FILE: .github/workflows/deploy.yml
# PURPOSE: End-to-End CI/CD Pipeline
# DESCRIPTION:
# - Build and test Node.js application
# - Build and push Docker image to Docker Hub
# - Provision EC2 infrastructure using Terraform
# - Retrieve dynamic EC2 public IP
# - Deploy container securely via SSH
# ==========================================

# ==========================================
# CI/CD PIPELINE CONFIGURATION
# ==========================================

name: Dynamic Recovery Pipeline

on:
  workflow_dispatch:

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

    # ==========================================
    # CHECKOUT
    # ==========================================

    - name: Checkout Repository
      uses: actions/checkout@v4

    # ==========================================
    # INSTALL NODE DEPENDENCIES
    # ==========================================

    - name: Install Dependencies
      run: npm install

    # ==========================================
    # RUN HEALTH TEST
    # ==========================================

    - name: Run Tests
      run: |
        node app.js &
        sleep 5
        curl -f http://localhost:3000/health

    # ==========================================
    # BUILD IMAGE
    # ==========================================

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/dynamic-recovery-app .

    # ==========================================
    # DOCKER LOGIN
    # ==========================================

    - name: Docker Login
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | \
        docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # ==========================================
    # PUSH IMAGE
    # ==========================================

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/dynamic-recovery-app

    # ==========================================
    # SETUP TERRAFORM
    # ==========================================

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # ==========================================
    # TERRAFORM INIT
    # ==========================================

    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    # ==========================================
    # TERRAFORM APPLY
    # ==========================================

    - name: Terraform Apply
      working-directory: terraform
      run: |
        terraform apply \
        -auto-approve \
        -var="public_key=${{ secrets.VM_PUBLIC_KEY }}"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    # ==========================================
    # RETRIEVE DYNAMIC PUBLIC IP
    # ==========================================

    - name: Get Dynamic Public IP
      id: ec2_ip
      working-directory: terraform
      run: |
        echo "ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT

    # ==========================================
    # WAIT FOR INSTANCE
    # ==========================================

    - name: Wait for Instance Readiness
      run: |
        chmod +x scripts/wait-for-instance.sh
        scripts/wait-for-instance.sh \
        ${{ steps.ec2_ip.outputs.ip }}

    # ==========================================
    # DEPLOY APPLICATION
    # ==========================================

    - name: Deploy Container
      uses: appleboy/ssh-action@v1.0.3

      with:

        host: ${{ steps.ec2_ip.outputs.ip }}

        username: ubuntu

        key: ${{ secrets.VM_SSH_KEY }}

        script: |

          sudo docker stop app || true

          sudo docker rm app || true

          sudo docker pull \

          ${{ secrets.DOCKER_USERNAME }}/dynamic-recovery-app

          sudo docker run -d \

          -p 3000:3000 \

          --name app \

          ${{ secrets.DOCKER_USERNAME }}/dynamic-recovery-app

          sudo docker ps