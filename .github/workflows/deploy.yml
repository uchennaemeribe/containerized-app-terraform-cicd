name: CI/CD Pipeline

# ============================
# 🔔 TRIGGER CONFIGURATION
# ============================
on:
  push:
    branches:
      - main

# ============================
# 🏗️ JOB DEFINITION
# ============================
jobs:
  deploy:
    runs-on: ubuntu-latest

    # ============================
    # 🔐 GLOBAL ENVIRONMENT VARIABLES (FROM GITHUB SECRETS)
    # ============================
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:

      # ============================
      # 📥 STEP 1: CHECKOUT SOURCE CODE
      # ============================
      - name: Checkout Repository
        uses: actions/checkout@v3

      # ============================
      # ⚙️ STEP 2: SETUP NODE ENVIRONMENT
      # ============================
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # ============================
      # 📦 STEP 3: INSTALL DEPENDENCIES
      # ============================
      - name: Install Dependencies
        run: npm install

      # ============================
      # 🧪 STEP 4: RUN APPLICATION TESTS
      # ============================
      - name: Run Tests
        run: npm test

      # ============================
      # 🐳 STEP 5: BUILD DOCKER IMAGE
      # ============================
      - name: Build Docker Image
        run: docker build -t $DOCKER_USERNAME/cicd-app .

      # ============================
      # 🔐 STEP 6: LOGIN TO DOCKER HUB
      # ============================
      - name: Login to Docker Hub
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      # ============================
      # 📤 STEP 7: PUSH IMAGE TO DOCKER HUB
      # ============================
      - name: Push Docker Image
        run: docker push $DOCKER_USERNAME/cicd-app

      # ============================
      # 🌍 STEP 8: SETUP TERRAFORM
      # ============================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ============================
      # 🔧 STEP 9: INITIALIZE TERRAFORM
      # ============================
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # ============================
      # 🚀 STEP 10: APPLY INFRASTRUCTURE (CREATE EC2)
      # ============================
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      # ============================
      # 🌐 STEP 11: GET DYNAMIC EC2 PUBLIC IP
      # (Overrides static VM_HOST secret)
      # ============================
      - name: Get EC2 Public IP
        working-directory: terraform
        run: |
          echo "VM_HOST=$(terraform output -raw public_ip)" >> $GITHUB_ENV

      # ============================
      # 🔐 STEP 12: DEPLOY APPLICATION TO EC2 VIA SSH
      # ============================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker pull $DOCKER_USERNAME/cicd-app
            docker stop app || true
            docker rm app || true
            docker run -d -p 80:3000 --name app $DOCKER_USERNAME/cicd-app

      # ============================
      # ✅ STEP 13: HEALTH CHECK
      # ============================
      - name: Health Check
        run: curl http://${{ env.VM_HOST }}/health