# ==========================================
# FILE: .github/workflows/deploy.yml
# PURPOSE: End-to-End CI/CD Pipeline
# DESCRIPTION:
# - Build and test Node.js application
# - Build and push Docker image to Docker Hub
# - Provision EC2 infrastructure using Terraform
# - Retrieve dynamic EC2 public IP
# - Deploy container securely via SSH
# ==========================================

# ==========================================
# CI/CD PIPELINE CONFIGURATION
# ==========================================

name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, Provision & Deploy
    runs-on: ubuntu-latest

    steps:

    # ==========================================
    # STEP 1: Checkout Repository
    # ==========================================
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ==========================================
    # STEP 2: Install Dependencies
    # ==========================================
    - name: Install Dependencies
      run: npm install

    # ==========================================
    # STEP 3: Run Tests (Health Check)
    # ==========================================
    - name: Run Tests
      run: |
        node app.js &
        sleep 5
        curl -f http://localhost:3000/health

    # ==========================================
    # STEP 4: Build Docker Image
    # ==========================================
    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-app .

    # ==========================================
    # STEP 5: Login to Docker Hub
    # ==========================================
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # ==========================================
    # STEP 6: Push Docker Image
    # ==========================================
    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd-app

    # ==========================================
    # STEP 7: Setup Terraform
    # ==========================================
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # ==========================================
    # STEP 8: Terraform Init (Upgrade Providers)
    # ==========================================
    - name: Terraform Init
      working-directory: terraform
      run: terraform init -upgrade

    # ==========================================
    # STEP 9: Terraform Apply (Provision EC2)
    # ==========================================
    - name: Terraform Apply
      working-directory: terraform
      run: terraform apply -auto-approve -var="public_key=${{ secrets.VM_PUBLIC_KEY }}"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    # ==========================================
    # STEP 10: Retrieve EC2 Public IP
    # ==========================================
    - name: Get EC2 Public IP
      id: ec2_ip
      working-directory: terraform
      run: echo "ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT

    # ==========================================
    # STEP 11: Wait for SSH Availability
    # ==========================================
    - name: Wait for EC2 SSH
      run: |
        for i in {1..15}; do
          nc -zv ${{ steps.ec2_ip.outputs.ip }} 22 && exit 0
          echo "Waiting for SSH..."
          sleep 10
        done
        exit 1

    # ==========================================
    # STEP 12: Deploy to EC2 (WITH DOCKER FIX)
    # ==========================================
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ steps.ec2_ip.outputs.ip }}
        username: ubuntu
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          echo "===== CHECKING DOCKER ====="
          if ! command -v docker &> /dev/null
          then
            echo "Docker not found. Installing..."
            sudo apt update -y
            sudo apt install -y docker.io
            sudo systemctl start docker
            sudo systemctl enable docker
          fi

          echo "===== FIX PERMISSIONS ====="
          sudo usermod -aG docker ubuntu

          echo "===== DEPLOY APPLICATION ====="
          sudo docker stop app || true
          sudo docker rm app || true
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-app
          sudo docker run -d -p 3000:3000 --name app ${{ secrets.DOCKER_USERNAME }}/cicd-app

          echo "===== VERIFY DEPLOYMENT ====="
          sudo docker ps