# ==========================================
# FILE: .github/workflows/deploy.yml
# PURPOSE: End-to-End CI/CD Pipeline
# DESCRIPTION:
# - Build & test Node.js app
# - Build & push Docker image
# - Provision infrastructure via Terraform
# - Dynamically retrieve EC2 public IP
# - Wait for EC2 readiness
# - Deploy container via SSH
# - Perform health check
# ==========================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    # ==========================================
    # STEP 1: Checkout Repository
    # ==========================================
    - name: Checkout Repository
      uses: actions/checkout@v3

    # ==========================================
    # STEP 2: Setup Node.js
    # ==========================================
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # ==========================================
    # STEP 3: Install Dependencies
    # ==========================================
    - name: Install Dependencies
      run: npm install

    # ==========================================
    # STEP 4: Run Tests (Start App + Health Check)
    # ==========================================
    - name: Run Tests (Start App + Health Check)
      run: |
        node app.js &
        sleep 5
        curl -f http://localhost:3000/health

    # ==========================================
    # STEP 5: Build Docker Image
    # ==========================================
    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-app .

    # ==========================================
    # STEP 6: Login to Docker Hub
    # ==========================================
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # ==========================================
    # STEP 7: Push Docker Image
    # ==========================================
    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd-app

    # ==========================================
    # STEP 8: Setup Terraform
    # ==========================================
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # ==========================================
    # STEP 9: Terraform Init
    # ==========================================
    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    # ==========================================
    # STEP 10: Terraform Apply
    # ==========================================
    - name: Terraform Apply
      working-directory: terraform
      run: terraform apply -auto-approve -var="public_key=${{ secrets.VM_PUBLIC_KEY }}"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    # ==========================================
    # STEP 11: Get EC2 Public IP
    # ==========================================
    - name: Get EC2 Public IP
      working-directory: terraform
      run: |
        terraform output -raw public_ip > ip.txt
        IP=$(cat ip.txt | tr -d '[:space:]')
        echo "VM_HOST=$IP" >> $GITHUB_ENV

    # ==========================================
    # STEP 12: Wait for EC2 SSH Readiness
    # ==========================================
    - name: Wait for EC2 SSH
      run: |
        echo "Waiting for EC2 to be ready..."
        for i in {1..12}; do
          nc -zv ${{ env.VM_HOST }} 22 && echo "SSH is ready" && exit 0
          echo "Still waiting for SSH..."
          sleep 10
        done
        echo "SSH not ready after waiting"
        exit 1

    # ==========================================
    # STEP 13: Deploy to EC2 via SSH
    # ==========================================
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.VM_HOST }}
        username: ubuntu
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          docker stop app || true
          docker rm app || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-app
          docker run -d -p 3000:3000 --name app ${{ secrets.DOCKER_USERNAME }}/cicd-app

    # ==========================================
    # STEP 14: Health Check (Production)
    # ==========================================
    - name: Health Check
      run: |
        sleep 10
        curl -f http://${{ env.VM_HOST }}:3000/health