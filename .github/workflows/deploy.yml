name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    ########################################
    # 📥 CHECKOUT SOURCE CODE
    ########################################
    - name: Checkout Repository
      uses: actions/checkout@v3

    ########################################
    # 🟢 SETUP NODE ENVIRONMENT
    ########################################
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "18"

    ########################################
    # 📦 INSTALL DEPENDENCIES
    ########################################
    - name: Install Dependencies
      run: npm install

    ########################################
    # 🧪 RUN APPLICATION TEST
    ########################################
    - name: Run Tests (Start App + Health Check)
      run: |
        node app.js &
        sleep 5
        curl -f http://localhost:3000/health

    ########################################
    # 🐳 BUILD DOCKER IMAGE
    ########################################
    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-app .

    ########################################
    # 🔐 LOGIN TO DOCKER HUB
    ########################################
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    ########################################
    # 📤 PUSH IMAGE TO DOCKER HUB
    ########################################
    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd-app

    ########################################
    # ⚙️ SETUP TERRAFORM
    ########################################
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    ########################################
    # 🔄 TERRAFORM INIT
    ########################################
    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    ########################################
    # 🚀 TERRAFORM APPLY (WITH PUBLIC KEY)
    ########################################
    - name: Terraform Apply
      working-directory: terraform
      run: terraform apply -auto-approve -var="public_key=${{ secrets.PUBLIC_KEY }}"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    ########################################
    # 🌐 GET EC2 PUBLIC IP
    ########################################
    - name: Get EC2 Public IP
      id: get_ip
      working-directory: terraform
      run: |
        echo "VM_HOST=$(terraform output -raw public_ip)" >> $GITHUB_ENV

    ########################################
    # 🚀 DEPLOY TO EC2 VIA SSH
    ########################################
    - name: Deploy to EC2
      run: |
        echo "${{ secrets.VM_SSH_KEY }}" > key.pem
        chmod 600 key.pem

        ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@$VM_HOST << 'EOF'
          docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-app
          docker stop app || true
          docker rm app || true
          docker run -d -p 3000:3000 --name app ${{ secrets.DOCKER_USERNAME }}/cicd-app
        EOF

    ########################################
    # ❤️ HEALTH CHECK (FINAL VALIDATION)
    ########################################
    - name: Health Check
      run: |
        sleep 10
        curl http://$VM_HOST:3000/health