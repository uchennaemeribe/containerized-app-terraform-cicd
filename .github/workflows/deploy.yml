# ==========================================
# FILE: .github/workflows/deploy.yml
# PURPOSE: End-to-End CI/CD Pipeline
# DESCRIPTION:
# - Build and test Node.js application
# - Build and push Docker image to Docker Hub
# - Provision EC2 infrastructure using Terraform
# - Retrieve dynamic EC2 public IP
# - Deploy container securely via SSH
# ==========================================

# ==========================================
# CI/CD PIPELINE CONFIGURATION
# ==========================================

name: CI/CD Pipeline Execution

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, Provision & Deploy Application
    runs-on: ubuntu-latest

    steps:

    # ==========================================
    # STEP 1: CHECKOUT SOURCE CODE
    # ==========================================
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ==========================================
    # STEP 2: INSTALL DEPENDENCIES
    # ==========================================
    - name: Install Dependencies
      run: npm install

    # ==========================================
    # STEP 3: RUN APPLICATION TESTS
    # ==========================================
    - name: Run Tests (Health Check)
      run: |
        node app.js &
        sleep 5
        curl -f http://localhost:3000/health

    # ==========================================
    # STEP 4: BUILD DOCKER IMAGE
    # ==========================================
    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-app .

    # ==========================================
    # STEP 5: AUTHENTICATE WITH DOCKER HUB
    # ==========================================
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # ==========================================
    # STEP 6: PUSH DOCKER IMAGE
    # ==========================================
    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd-app

    # ==========================================
    # STEP 7: SETUP TERRAFORM
    # ==========================================
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # ==========================================
    # STEP 8: INITIALIZE TERRAFORM (FIX PROVIDER ISSUES)
    # ==========================================
    - name: Terraform Init
      working-directory: terraform
      run: terraform init -upgrade

    # ==========================================
    # STEP 9: PROVISION INFRASTRUCTURE
    # ==========================================
    - name: Terraform Apply
      working-directory: terraform
      run: terraform apply -auto-approve -var="public_key=${{ secrets.VM_PUBLIC_KEY }}"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    # ==========================================
    # STEP 10: RETRIEVE EC2 PUBLIC IP
    # ==========================================
    - name: Get EC2 Public IP
      id: ec2_ip
      working-directory: terraform
      run: echo "ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT

    # ==========================================
    # STEP 11: DISPLAY APPLICATION URL
    # ==========================================
    - name: Display Public Endpoint
      run: echo "Application URL → http://${{ steps.ec2_ip.outputs.ip }}:3000/health"

    # ==========================================
    # STEP 12: WAIT FOR SSH READINESS
    # ==========================================
    - name: Wait for EC2 SSH
      run: |
        for i in {1..12}; do
          nc -zv ${{ steps.ec2_ip.outputs.ip }} 22 && echo "SSH Ready" && exit 0
          echo "Waiting for SSH..."
          sleep 10
        done
        exit 1

    # ==========================================
    # STEP 13: DEPLOY APPLICATION TO EC2
    # ==========================================
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ steps.ec2_ip.outputs.ip }}
        username: ubuntu
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          echo "Starting deployment..."

          sudo docker stop app || true
          sudo docker rm app || true

          echo "Pulling latest image..."
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-app

          echo "Running container..."
          sudo docker run -d -p 3000:3000 --name app ${{ secrets.DOCKER_USERNAME }}/cicd-app

          echo "Verifying deployment..."
          sudo docker ps

          echo "Deployment complete"