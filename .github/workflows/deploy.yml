name: Full CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 🔹 BUILD STAGE
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-app .

      # 🔹 TEST STAGE
      - name: Run Container
        run: docker run -d -p 3000:3000 --name test-app ${{ secrets.DOCKER_USERNAME }}/cicd-app

      - name: Health Check
        run: |
          sleep 5
          curl -f http://localhost:3000/health

      # 🔹 NOTIFY STAGE
      - name: Notify Success
        run: echo "Build and tests passed successfully"

      # 🔹 DELIVERY STAGE
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd-app

      # 🔹 DEPLOYMENT STAGE
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker stop app || true
            docker rm app || true

            docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-app

            docker run -d -p 80:3000 --name app \
              ${{ secrets.DOCKER_USERNAME }}/cicd-app
