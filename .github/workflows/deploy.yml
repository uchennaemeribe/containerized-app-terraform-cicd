# ==========================================================
# FILE: .github/workflows/deploy.yml
# PURPOSE:
# Dynamic Infrastructure Recovery CI/CD Pipeline
#
# FEATURES:
# - Builds Docker image
# - Pushes image to Docker Hub
# - Dynamically provisions EC2 via Terraform
# - Waits for EC2 + Docker readiness
# - Deploys container automatically
# - Supports full terraform destroy recovery workflow
# ==========================================================

name: Dynamic Recovery Pipeline

on:
  push:
    branches:
      - main

jobs:

  deploy:
    name: Build Provision Deploy
    runs-on: ubuntu-latest

    steps:

    # ==========================================================
    # STEP 1 — CHECKOUT REPOSITORY
    # ==========================================================

    - name: Checkout Repository
      uses: actions/checkout@v4

    # ==========================================================
    # STEP 2 — INSTALL NODE DEPENDENCIES
    # ==========================================================

    - name: Install Dependencies
      run: npm install

    # ==========================================================
    # STEP 3 — APPLICATION HEALTH TEST
    # ==========================================================

    - name: Run Health Check Test
      run: |
        node app.js &
        sleep 5
        curl -f http://localhost:3000/health

    # ==========================================================
    # STEP 4 — BUILD DOCKER IMAGE
    # ==========================================================

    - name: Build Docker Image
      run: |
        docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/dynamic-recovery-app .

    # ==========================================================
    # STEP 5 — LOGIN TO DOCKER HUB
    # ==========================================================

    - name: Docker Hub Login
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | \
        docker login \
        -u "${{ secrets.DOCKER_USERNAME }}" \
        --password-stdin

    # ==========================================================
    # STEP 6 — PUSH IMAGE TO DOCKER HUB
    # ==========================================================

    - name: Push Docker Image
      run: |
        docker push \
        ${{ secrets.DOCKER_USERNAME }}/dynamic-recovery-app

    # ==========================================================
    # STEP 7 — SETUP TERRAFORM
    # ==========================================================

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # ==========================================================
    # STEP 8 — TERRAFORM INIT
    # ==========================================================

    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    # ==========================================================
    # STEP 9 — TERRAFORM VALIDATE
    # ==========================================================

    - name: Terraform Validate
      working-directory: terraform
      run: terraform validate

    # ==========================================================
    # STEP 10 — TERRAFORM APPLY
    # ==========================================================

    - name: Terraform Apply
      working-directory: terraform
      run: |
        terraform apply \
        -auto-approve \
        -var="public_key=${{ secrets.VM_PUBLIC_KEY }}"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    # ==========================================================
    # STEP 11 — RETRIEVE EC2 PUBLIC IP
    # ==========================================================

    - name: Retrieve EC2 Public IP
      id: ec2_ip
      working-directory: terraform
      run: |
        echo "ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT

    # ==========================================================
    # STEP 12 — CONFIGURE SSH KEY
    # ==========================================================

    - name: Configure SSH Key
      run: |
        mkdir -p ~/.ssh

        echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/temp_key

        chmod 600 ~/.ssh/temp_key

    # ==========================================================
    # STEP 13 — WAIT FOR INSTANCE + DOCKER READINESS
    # ==========================================================

    - name: Wait for Instance Readiness
      run: |

        echo "Waiting for EC2 + Docker readiness..."

        for i in {1..30}; do

          ssh \
          -o StrictHostKeyChecking=no \
          -i ~/.ssh/temp_key \
          ubuntu@${{ steps.ec2_ip.outputs.ip }} \
          "docker --version" && break

          echo "Docker not ready yet..."

          sleep 15

        done

        ssh \
        -o StrictHostKeyChecking=no \
        -i ~/.ssh/temp_key \
        ubuntu@${{ steps.ec2_ip.outputs.ip }} \
        "docker --version"

    # ==========================================================
    # STEP 14 — DEPLOY CONTAINER
    # ==========================================================

    - name: Deploy Container
      uses: appleboy/ssh-action@v1.0.3

      with:

        host: ${{ steps.ec2_ip.outputs.ip }}

        username: ubuntu

        key: ${{ secrets.VM_SSH_KEY }}

        script: |

          sudo docker stop app || true

          sudo docker rm app || true

          sudo docker pull \
          ${{ secrets.DOCKER_USERNAME }}/dynamic-recovery-app

          sudo docker run -d \
          -p 3000:3000 \
          --name app \
          ${{ secrets.DOCKER_USERNAME }}/dynamic-recovery-app

          sudo docker ps

    # ==========================================================
    # STEP 15 — DISPLAY APPLICATION URL
    # ==========================================================

    - name: Display Live URL
      run: |
        echo "Application URL:"
        echo "http://${{ steps.ec2_ip.outputs.ip }}:3000"