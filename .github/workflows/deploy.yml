# ==========================================
# FILE: .github/workflows/deploy.yml
# PURPOSE: Full CI/CD pipeline
# ==========================================

name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, Provision & Deploy
    runs-on: ubuntu-latest

    steps:

    # ======================================================
    # CHECKOUT CODE
    # ======================================================
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ======================================================
    # INSTALL DEPENDENCIES
    # ======================================================
    - name: Install Dependencies
      run: npm install

    # ======================================================
    # RUN TESTS
    # ======================================================
    - name: Run Tests
      run: |
        node app.js &
        sleep 5
        curl -f http://localhost:3000/health

    # ======================================================
    # BUILD DOCKER IMAGE
    # ======================================================
    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-app .

    # ======================================================
    # LOGIN TO DOCKER HUB
    # ======================================================
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # ======================================================
    # PUSH DOCKER IMAGE
    # ======================================================
    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd-app

    # ======================================================
    # SETUP TERRAFORM
    # ======================================================
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # ======================================================
    # TERRAFORM INIT
    # ======================================================
    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    # ======================================================
    # TERRAFORM APPLY
    # ======================================================
    - name: Terraform Apply
      working-directory: terraform
      run: |
        terraform apply -auto-approve \
        -var="public_key=${{ secrets.VM_PUBLIC_KEY }}" \
        -var="aws_region=${{ secrets.AWS_DEFAULT_REGION }}"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    # ======================================================
    # GET EC2 PUBLIC IP
    # ======================================================
    - name: Get EC2 Public IP
      id: ec2_ip
      working-directory: terraform
      run: |
        IP=$(terraform output -raw public_ip)
        echo "ip=$IP" >> $GITHUB_OUTPUT

        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "**EC2 IP:** $IP" >> $GITHUB_STEP_SUMMARY
        echo "**SSH:** ssh -i ~/.ssh/id_rsa ubuntu@$IP" >> $GITHUB_STEP_SUMMARY
        echo "**App URL:** http://$IP:3000" >> $GITHUB_STEP_SUMMARY

    # ======================================================
    # WAIT FOR SSH
    # ======================================================
    - name: Wait for SSH
      run: |
        IP=${{ steps.ec2_ip.outputs.ip }}
        for i in {1..12}; do
          nc -zv $IP 22 && echo "SSH Ready" && exit 0
          echo "Waiting for SSH..."
          sleep 10
        done
        exit 1

    # ======================================================
    # DEPLOY TO EC2
    # ======================================================
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ steps.ec2_ip.outputs.ip }}
        username: ubuntu
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          echo "Waiting for Docker..."
          for i in {1..10}; do
            docker info && break
            sleep 5
          done

          docker stop app || true
          docker rm app || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-app
          docker run -d -p 3000:3000 --name app ${{ secrets.DOCKER_USERNAME }}/cicd-app